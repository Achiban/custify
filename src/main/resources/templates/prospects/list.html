<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Prospects - Custify</title>
    <style>
        body { background-color: #1e2a3a; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background-color: #16212e; min-height: 100vh; padding: 20px 0; position: fixed; width: 200px; }
        .sidebar-brand { color: #4fc3f7; font-weight: bold; padding: 0 20px; margin-bottom: 30px; font-size: 1.2rem; }
        .sidebar-nav { list-style: none; padding: 0; margin: 0; }
        .sidebar-nav li { padding: 12px 20px; cursor: pointer; transition: background-color 0.3s; }
        .sidebar-nav li:hover { background-color: #1e2a3a; }
        .sidebar-nav li a { color: #b0bec5; text-decoration: none; }
        .logout-btn { background-color: #e74c3c; border: none; color: white; padding: 10px 20px; border-radius: 5px; position: fixed; bottom: 20px; left: 20px; cursor: pointer; }
        .main { margin-left: 220px; padding: 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header h2 { margin: 0; color: #4fc3f7; }
        .btn-primary { background-color: #4fc3f7; color: #fff; padding: 10px 16px; border: none; border-radius: 5px; text-decoration: none; }
        .btn-primary:hover { background-color: #3ab0e0; }
        .alert { padding: 12px 15px; border-radius: 6px; margin-bottom: 20px; }
        .alert-success { background-color: #173a1e; border: 1px solid #2ecc71; color: #b3ffcc; }
        .alert-error { background-color: #4a1f1f; border: 1px solid #e74c3c; color: #ffb3b3; }
        table { width: 100%; border-collapse: collapse; background-color: #263645; }
        th, td { padding: 14px 12px; border-bottom: 1px solid #3a4a5c; text-align: left; }
        th { color: #4fc3f7; }
        a { color: #4fc3f7; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .no-results { text-align: center; color: #999; padding: 30px 0; }
        .actions a { margin-right: 10px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand">Custify  <span sec:authorize="hasRole('ADMIN')">ADMIN</span><span sec:authorize="hasRole('COMMERCIAL')">COMMERCIAL</span></div>
        <ul class="sidebar-nav">
            <li><a href="/dashboard">Dashboard</a></li>
            <li sec:authorize="hasRole('ADMIN')"><a href="/users">Utilisateurs</a></li>
            <li sec:authorize="hasAnyRole('ADMIN','COMMERCIAL')"><a href="/clients">Clients</a></li>
            <li sec:authorize="hasAnyRole('ADMIN','COMMERCIAL')"><a href="/prospects">Prospects</a></li>
            <li sec:authorize="hasAnyRole('ADMIN','COMMERCIAL')"><a href="/opportunites">Opportunités</a></li>
            <li sec:authorize="hasAnyRole('ADMIN','COMMERCIAL')"><a href="/interactions">Interactions</a></li>
        </ul>
        <form th:action="@{/logout}" method="post"><button type="submit" class="logout-btn">Déconnexion</button></form>
    </div>

    <div class="main">
        <div class="header">
            <h2>Liste des Prospects</h2>
            <a sec:authorize="hasRole('COMMERCIAL')" class="btn-primary" href="/prospects/new">+ Ajouter Prospect</a>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div th:if="${prospects.size()} > 0">
            <table>
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Email</th>
                        <th>Source</th>
                        <th>Statut</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="prospect : ${prospects}">
                        <td th:text="${prospect.nom}"></td>
                        <td th:text="${prospect.email}"></td>
                        <td th:text="${prospect.source}"></td>
                        <td th:text="${prospect.statut}"></td>
                        <td class="actions"><a th:href="@{'/prospects/details/' + ${prospect.id}}">Voir</a></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${prospects.size()} == 0" class="no-results">
            <p>Aucun prospect trouvé pour le moment.</p>
            <p sec:authorize="hasRole('COMMERCIAL')"><a href="/prospects/new">Créer un premier prospect</a></p>
        </div>
    </div>
</body>
</html>
