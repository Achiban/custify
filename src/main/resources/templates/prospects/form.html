<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Créer Prospect - Custify</title>
    <style>
        body { background-color: #1e2a3a; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .sidebar { background-color: #16212e; min-height: 100vh; padding: 20px 0; position: fixed; width: 200px; }
        .sidebar-brand { color: #4fc3f7; font-weight: bold; padding: 0 20px; margin-bottom: 30px; font-size: 1.2rem; }
        .sidebar-nav { list-style: none; padding: 0; margin: 0; }
        .sidebar-nav li { padding: 12px 20px; cursor: pointer; transition: background-color 0.3s; }
        .sidebar-nav li:hover { background-color: #1e2a3a; }
        .sidebar-nav li a { color: #b0bec5; text-decoration: none; }
        .logout-btn { background-color: #e74c3c; border: none; color: white; padding: 10px 20px; border-radius: 5px; position: fixed; bottom: 20px; left: 20px; cursor: pointer; }
        .main-content { margin-left: 220px; padding: 30px; }
        .form-container { background-color: #263645; padding: 30px; border-radius: 8px; width: 500px; }
        .form-group { margin-bottom: 18px; }
        label { color: #b0bec5; display: block; margin-bottom: 8px; }
        input, select { width: 100%; padding: 10px; background-color: #1e2a3a; border: 1px solid #3a4a5c; color: white; border-radius: 5px; }
        input:focus, select:focus { border-color: #4fc3f7; outline: none; }
        .btn { background-color: #4fc3f7; color: white; border: none; padding: 10px 22px; cursor: pointer; border-radius: 5px; }
        .btn:hover { background-color: #3ab0e0; }
        .error-message { color: #ffb3b3; margin-bottom: 18px; }
        .back-link { display: inline-block; margin-top: 20px; color: #b0bec5; }
        .back-link:hover { color: #4fc3f7; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand">Custify  <span sec:authorize="hasRole('ADMIN')">ADMIN</span><span sec:authorize="hasRole('COMMERCIAL')">COMMERCIAL</span></div>
        <ul class="sidebar-nav">
            <li><a href="/dashboard">Dashboard</a></li>
            <li sec:authorize="hasRole('ADMIN')"><a href="/users">Utilisateurs</a></li>
            <li sec:authorize="hasAnyRole('ADMIN','COMMERCIAL')"><a href="/clients">Clients</a></li>
            <li sec:authorize="hasAnyRole('ADMIN','COMMERCIAL')"><a href="/prospects">Prospects</a></li>
            <li sec:authorize="hasAnyRole('ADMIN','COMMERCIAL')"><a href="/opportunites">Opportunités</a></li>
            <li sec:authorize="hasAnyRole('ADMIN','COMMERCIAL')"><a href="/interactions">Interactions</a></li>
        </ul>
        <form th:action="@{/logout}" method="post"><button type="submit" class="logout-btn">Déconnexion</button></form>
    </div>

    <div class="main-content">
        <h2>Créer un Prospect</h2>

        <div class="form-container">
            <div th:if="${error}" class="error-message" th:text="${error}"></div>
            <form th:action="@{/prospects/save}" th:object="${prospect}" method="post">
                <div class="form-group">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" th:field="*{nom}" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" required>
                </div>
                <div class="form-group">
                    <label for="source">Source</label>
                    <input type="text" id="source" th:field="*{source}" required>
                </div>
                <div class="form-group">
                    <label for="statut">Statut</label>
                    <select id="statut" th:field="*{statut}" required>
                        <option value="" disabled="disabled" th:selected="${prospect.statut} == null">-- Sélectionner un statut --</option>
                        <option th:each="statut : ${statuts}" th:value="${statut}" th:text="${statut}"></option>
                    </select>
                </div>
                <button type="submit" class="btn">Créer</button>
            </form>
            <a class="back-link" href="/prospects/list">← Retour à la liste des prospects</a>
        </div>
    </div>
</body>
</html>
