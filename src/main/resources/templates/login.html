<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Custify</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #1e2a3a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            background-color: #263645;
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 {
            color: #4fc3f7;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        .login-header p {
            color: #b0bec5;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #b0bec5;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background-color: #1e2a3a;
            border: 1px solid #3a4a5c;
            border-radius: 5px;
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4fc3f7;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #4fc3f7;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .login-btn:hover {
            background-color: #3ab0e0;
        }
        .alert {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .alert-danger {
            background-color: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            color: #e74c3c;
        }
        .alert-success {
            background-color: rgba(46, 204, 113, 0.2);
            border: 1px solid #2ecc71;
            color: #2ecc71;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Custify</h1>
            <p>Connectez-vous à votre compte</p>
        </div>

        <div th:if="${error}" class="alert alert-danger">
            <span th:text="${error}">Error message</span>
        </div>

        <div th:if="${message}" class="alert alert-success">
            <span th:text="${message}">Success message</span>
        </div>

        <form method="post" th:action="@{/login}">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="login-btn">Se connecter</button>
        </form>
        <div style="text-align:center; margin-top:20px;">
            <p style="color:#b0bec5; font-size:0.9rem;">Pas encore de compte ?
                <a th:href="@{/inscription}" style="color:#4fc3f7; text-decoration:none; font-weight:500;">S'inscrire</a>
            </p>
            <a th:href="@{/}" style="color:#b0bec5; text-decoration:none; font-size:0.85rem;">← Retour au catalogue</a>
        </div>
    </div>
</body>
</html>
