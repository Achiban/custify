<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Custify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background: #1e293b; width: 220px; min-height: 100vh; position: fixed; padding: 20px 0; border-right: 1px solid #334155; }
        .sidebar-brand { color: #ef4444; font-weight: 700; font-size: 1.2rem; padding: 0 20px; margin-bottom: 30px; }
        .sidebar-nav { list-style: none; padding: 0; }
        .sidebar-nav li a { display: block; padding: 12px 20px; color: #94a3b8; text-decoration: none; transition: 0.2s; }
        .sidebar-nav li a:hover, .sidebar-nav li a.active { background: #0f172a; color: #ef4444; }
        .main { margin-left: 220px; padding: 30px; }
        .header h1 { color: #ef4444; font-size: 1.6rem; margin-bottom: 30px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; border-left: 3px solid #ef4444; }
        .stat-card h3 { color: #94a3b8; font-size: 0.9rem; margin-bottom: 8px; }
        .stat-card .val { font-size: 2rem; font-weight: 700; color: #fff; }
        .logout-btn { background: #ef4444; border: none; color: #fff; padding: 10px 20px; border-radius: 8px; position: fixed; bottom: 20px; left: 20px; cursor: pointer; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-brand">Custify ADMIN</div>
    <ul class="sidebar-nav">
        <li><a href="/admin/dashboard" class="active">Dashboard</a></li>
        <li><a href="/admin/users">Utilisateurs</a></li>
        <li><a href="/">Catalogue public</a></li>
    </ul>
    <form th:action="@{/logout}" method="post"><button type="submit" class="logout-btn">Déconnexion</button></form>
</div>
<div class="main">
    <div class="header"><h1>Administration</h1></div>
    <div class="stats">
        <div class="stat-card"><h3>Total Utilisateurs</h3><div class="val" th:text="${totalUtilisateurs}">0</div></div>
        <div class="stat-card"><h3>Clients</h3><div class="val" th:text="${totalClients}">0</div></div>
        <div class="stat-card"><h3>Commerciaux</h3><div class="val" th:text="${totalCommerciaux}">0</div></div>
    </div>
    <a href="/admin/users" class="btn btn-outline-light">Gérer les utilisateurs →</a>
</div>
</body>
</html>
