<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails de l'interaction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/auth.css}" rel="stylesheet">
<style>
    body {
        background-color: #1e2a3a !important;
        color: #fff !important;
    }

    /* Formulaires et inputs */
    .form-control, .form-select {
        background-color: #2a3f52 !important;
        border-color: #3a5068 !important;
        color: #fff !important;
    }
    
    .form-control:focus, .form-select:focus {
        background-color: #354a5f !important;
        border-color: #4fc3f7 !important;
        color: #fff !important;
        box-shadow: 0 0 0 0.2rem rgba(79, 195, 247, 0.25) !important;
    }
    
    /* Cards */
    .card {
        background-color: #2a3f52 !important;
        border-color: #3a5068 !important;
        color: #fff !important;
    }
    
    .card-header {
        background-color: #354a5f !important;
        border-color: #3a5068 !important;
        color: #fff !important;
    }
    
    .card-body {
        background-color: #2a3f52 !important;
        color: #fff !important;
    }
    
    .card-footer {
        background-color: #354a5f !important;
        border-color: #3a5068 !important;
    }
    
    /* Alertes */
    .alert-light {
        background-color: #354a5f !important;
        border-color: #3a5068 !important;
        color: #fff !important;
    }
</style>
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!-- Header -->
                <div class="mb-4">
                    <h2 class="h2 mb-3">
                        <i class="fas fa-comment-dots"></i> Détails de l'interaction
                    </h2>
                </div>

                <!-- Messages d'erreur -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Card de détails -->
                <div th:if="${interaction}" class="card card-dark">
                    <div class="card-header">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h4 class="mb-2">
                                    <i th:class="'fas ' + (${interaction.type == 'APPEL' ? 'fa-phone' : interaction.type == 'EMAIL' ? 'fa-envelope' : interaction.type == 'REUNION' ? 'fa-users' : 'fa-sticky-note'})"></i>
                                    <span th:text="${interaction.type}"></span>
                                </h4>
                            </div>
                            <div>
                                <span class="badge-interaction badge-info">
                                    <i class="fas fa-calendar"></i>
                                    <span th:text="${#temporals.format(interaction.dateHeure, 'dd/MM/yyyy HH:mm')}"></span>
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="card-body">
                        <!-- Informations du client -->
                        <div class="mb-4">
                            <h5>
                                <i class="fas fa-building"></i> Client
                            </h5>
                            <div class="alert alert-light">
                                <p class="mb-0">
                                    <strong th:text="${interaction.client.nom}"></strong><br>
                                    <small class="text-muted">
                                        <i class="fas fa-envelope"></i> <span th:text="${interaction.client.email}"></span><br>
                                        <i class="fas fa-phone"></i> <span th:text="${interaction.client.telephone}"></span>
                                    </small>
                                    <span th:if="${interaction.client.entreprise}">
                                        <br><small class="text-muted"><i class="fas fa-briefcase"></i> <span th:text="${interaction.client.entreprise}"></span></small>
                                    </span>
                                </p>
                            </div>
                        </div>

                        <!-- Informations de l'utilisateur -->
                        <div class="mb-4">
                            <h5>
                                <i class="fas fa-user-tie"></i> Créée par
                            </h5>
                            <div class="alert alert-light">
                                <p class="mb-0">
                                    <strong th:text="${interaction.utilisateur.nom}"></strong><br>
                                    <small class="text-muted">
                                        <i class="fas fa-envelope"></i> <span th:text="${interaction.utilisateur.email}"></span>
                                    </small>
                                </p>
                            </div>
                        </div>

                        <!-- Résumé de l'interaction -->
                        <div class="mb-4">
                            <h5>
                                <i class="fas fa-list"></i> Résumé
                            </h5>
                            <div class="alert alert-light" style="white-space: pre-wrap;">
                                <p class="mb-0" th:text="${interaction.resume}"></p>
                            </div>
                        </div>

                        <!-- Métadonnées -->
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <h6 class="text-muted">Type d'interaction</h6>
                                <p th:text="${interaction.type}"></p>
                            </div>
                            <div class="col-md-6">
                                <h6 class="text-muted">Date et Heure</h6>
                                <p th:text="${#temporals.format(interaction.dateHeure, 'dd MMMM yyyy à HH:mm')}"></p>
                            </div>
                        </div>
                    </div>

                    <!-- Boutons d'action -->
                    <div class="card-footer bg-light">
                        <div class="btn-group w-100" role="group">
                            <a th:href="@{/interactions/modifier/{id}(id=${interaction.id})}" class="btn btn-edit">
                                <i class="fas fa-edit"></i> Modifier
                            </a>
                            <form th:action="@{/interactions/supprimer/{id}(id=${interaction.id})}" method="post" style="display: inline; width: auto;">
                                <button type="submit" class="btn btn-delete" onclick="return confirm('Êtes-vous sûr de vouloir supprimer cette interaction?')">
                                    <i class="fas fa-trash"></i> Supprimer
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Boutons de navigation -->
                <div class="mt-4">
                    <a th:href="@{/interactions/client/{id}(id=${interaction.client.id})}" class="btn btn-outline-primary">
                        <i class="fas fa-history"></i> Historique des interactions
                    </a>
                    <a th:href="@{/clients/details/{id}(id=${interaction.client.id})}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Retour au client
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
