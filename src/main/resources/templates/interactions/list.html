<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Historique des interactions - ' + ${client.nom}">Interactions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/auth.css}" rel="stylesheet">
<style>
    body {
        background-color: #1e2a3a !important;
        color: #fff !important;
    }

    /* Formulaires et inputs */
    .form-control, .form-select {
        background-color: #2a3f52 !important;
        border-color: #3a5068 !important;
        color: #fff !important;
    }
    
    .form-control:focus, .form-select:focus {
        background-color: #354a5f !important;
        border-color: #4fc3f7 !important;
        color: #fff !important;
        box-shadow: 0 0 0 0.2rem rgba(79, 195, 247, 0.25) !important;
    }
    
    /* Cards */
    .card {
        background-color: #2a3f52 !important;
        border-color: #3a5068 !important;
        color: #fff !important;
    }
    
    .card-header {
        background-color: #354a5f !important;
        border-color: #3a5068 !important;
        color: #fff !important;
    }
    
    .card-body {
        background-color: #2a3f52 !important;
        color: #fff !important;
    }
    
    .card-footer {
        background-color: #354a5f !important;
        border-color: #3a5068 !important;
    }
</style>
</head>

<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <!-- Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="h2 mb-2">
                            <i class="fas fa-history"></i> Historique des interactions
                        </h2>
                        <p class="text-muted">
                            Client: <strong th:text="${client.nom}"></strong>
                        </p>
                    </div>
                    <div>
                        <a th:href="@{/interactions/nouveau/{id}(id=${client.id})}" class="btn btn-primary">
                            <i class="fas fa-plus"></i> Nouvelle interaction
                        </a>
                    </div>
                </div>

                <!-- Messages de succès -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Messages d'erreur -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Liste des interactions -->
                <div th:if="${interactions != null and interactions.size() > 0}">
                    <div class="timeline">
                        <div th:each="interaction : ${interactions}" class="timeline-item">
                            <div class="card card-dark mb-3">
                                <div class="card-header">
                                    <div class="d-flex justify-content-between align-items-start">
                                        <div>
                                            <h5 class="card-title mb-1">
                                                <i th:class="'fas ' + (${interaction.type == 'APPEL' ? 'fa-phone' : interaction.type == 'EMAIL' ? 'fa-envelope' : interaction.type == 'REUNION' ? 'fa-users' : 'fa-sticky-note'})"></i>
                                                <span th:text="${interaction.type}"></span>
                                            </h5>
                                            <small class="text-muted">
                                                <i class="fas fa-calendar"></i>
                                                <span th:text="${#temporals.format(interaction.dateHeure, 'dd/MM/yyyy HH:mm')}"></span>
                                                |
                                                <i class="fas fa-user"></i>
                                                <span th:text="${interaction.utilisateur.nom}"></span>
                                            </small>
                                        </div>
                                        <div class="btn-group" role="group">
                                            <a th:href="@{/interactions/details/{id}(id=${interaction.id})}" class="btn-sm btn-view" title="Voir">
                                                <i class="fas fa-eye"></i>
                                            </a>
                                            <a th:href="@{/interactions/modifier/{id}(id=${interaction.id})}" class="btn-sm btn-edit" title="Modifier">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <form th:action="@{/interactions/supprimer/{id}(id=${interaction.id})}" method="post" style="display: inline;">
                                                <button type="submit" class="btn-sm btn-delete" onclick="return confirm('Êtes-vous sûr de vouloir supprimer cette interaction?')" title="Supprimer">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-body">
                                    <p class="card-text" th:text="${interaction.resume}"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Message si aucune interaction -->
                <div th:if="${interactions == null or interactions.size() == 0}" class="alert alert-info">
                    <i class="fas fa-info-circle"></i>
                    Aucune interaction enregistrée pour ce client.
                    <a th:href="@{/interactions/nouveau/{id}(id=${client.id})}">Créer la première interaction</a>
                </div>

                <!-- Boutons de navigation -->
                <div class="mt-4">
                    <a th:href="@{/clients/details/{id}(id=${client.id})}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Retour aux détails du client
                    </a>
                    <a th:href="@{/clients/list}" class="btn btn-outline-secondary">
                        <i class="fas fa-list"></i> Liste des clients
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .timeline {
            position: relative;
            padding: 20px 0;
        }

        .timeline-item {
            position: relative;
            padding-left: 30px;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background-color: #0d6efd;
            border-radius: 2px;
        }

        .timeline-item::after {
            content: '';
            position: absolute;
            left: -8px;
            top: 25px;
            width: 18px;
            height: 18px;
            background-color: #0d6efd;
            border-radius: 50%;
            border: 3px solid white;
        }

        .card-header {
            border-bottom: 1px solid #e0e0e0;
        }

        .btn-group .btn {
            margin-left: 2px;
        }
    </style>
</body>

</html>
