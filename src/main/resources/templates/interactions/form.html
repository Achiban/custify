<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enregistrer une Interaction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/auth.css}" rel="stylesheet">
<style>
    body {
        background-color: #1e2a3a !important;
        color: #fff !important;
    }

    /* Formulaires et inputs */
    .form-control, .form-select {
        background-color: #2a3f52 !important;
        border-color: #3a5068 !important;
        color: #fff !important;
    }
    
    .form-control:focus, .form-select:focus {
        background-color: #354a5f !important;
        border-color: #4fc3f7 !important;
        color: #fff !important;
        box-shadow: 0 0 0 0.2rem rgba(79, 195, 247, 0.25) !important;
    }
    
    .form-label {
        color: #e0e0e0 !important;
    }
    
    /* Cards */
    .card {
        background-color: #2a3f52 !important;
        border-color: #3a5068 !important;
        color: #fff !important;
    }
    
    .card-header {
        background-color: #354a5f !important;
        border-color: #3a5068 !important;
        color: #fff !important;
    }
    
    .card-body {
        background-color: #2a3f52 !important;
        color: #fff !important;
    }
    
    .card-footer {
        background-color: #354a5f !important;
        border-color: #3a5068 !important;
    }
</style>
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="mb-4">
                    <h2 class="h2 mb-3">
                        <i class="fas fa-comment-dots"></i> 
                        Enregistrer une Interaction
                    </h2>
                    <p class="text-muted">
                        <span th:if="${client}">Client: <strong th:text="${client.nom}"></strong></span>
                        <span th:if="!${client}">Selectionnez un client ou prospect pour creer une interaction</span>
                    </p>
                </div>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form th:action="${id != null} ? @{/interactions/modifier/{id}(id=${id})} : @{/interactions/creer}" 
                      method="post" th:object="${interaction}" class="needs-validation" novalidate>
                    
                    <input type="hidden" th:if="${id != null}" name="id" th:value="${id}">
                    
                    <div class="mb-3" th:if="!${client}">
                        <label for="clientId" class="form-label">Client / Prospect <span class="text-danger">*</span></label>
                        <select class="form-select" id="clientId" th:field="*{clientId}" required>
                            <option value="">-- Selectionnez un client ou prospect --</option>
                            <option th:each="c : ${clients}" th:value="${c.id}" th:text="${c.nom}"></option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('clientId')}">
                            <span th:errors="*{clientId}"></span>
                        </div>
                    </div>

                    <input type="hidden" th:if="${client}" th:field="*{clientId}" th:value="${client.id}">
                    
                    <div class="mb-3">
                        <label for="type" class="form-label">Type d'interaction <span class="text-danger">*</span></label>
                        <select class="form-select" id="type" th:field="*{type}" required>
                            <option value="">-- Selectionnez un type --</option>
                            <option th:each="type : ${typesInteraction}" th:value="${type}" th:text="${type}"></option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('type')}">
                            <span th:errors="*{type}"></span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="dateHeure" class="form-label">Date et Heure <span class="text-danger">*</span></label>
                        <input type="datetime-local" class="form-control" id="dateHeure" th:field="*{dateHeure}" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('dateHeure')}">
                            <span th:errors="*{dateHeure}"></span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="resume" class="form-label">Resume de l'interaction <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="resume" th:field="*{resume}" rows="5" 
                                  placeholder="Decrivez le contenu de l'interaction (appel, email, reunion, etc.)" required></textarea>
                        <small class="form-text text-muted">Maximum 1000 caracteres</small>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('resume')}">
                            <span th:errors="*{resume}"></span>
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-start mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Enregistrer l'interaction
                        </button>
                        <a th:href="@{/interactions/list}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Annuler
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            'use strict';
            window.addEventListener('load', function () {
                var forms = document.querySelectorAll('.needs-validation');
                Array.prototype.slice.call(forms).forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        if (!form.checkValidity()) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                        form.classList.add('was-validated');
                    }, false);
                });
            });
        })();

        document.addEventListener('DOMContentLoaded', function() {
            const dateInput = document.getElementById('dateHeure');
            if (!dateInput.value) {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                dateInput.value = `${year}-${month}-${day}T${hours}:${minutes}`;
            }
        });
    </script>
</body>

</html>
