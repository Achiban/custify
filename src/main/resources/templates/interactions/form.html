<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enregistrer une Interaction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/auth.css}" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!-- Header -->
                <div class="mb-4">
                    <h2 class="h2 mb-3">
                        <i class="fas fa-comment-dots"></i> 
                        Enregistrer une Interaction
                    </h2>
                    <p class="text-muted">
                        <span th:if="${client}">Client: <strong th:text="${client.nom}"></strong></span>
                        <span th:if="!${client}">Sélectionnez un client ou prospect pour créer une interaction</span>
                    </p>
                </div>

                <!-- Messages d'erreur -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Formulaire -->
                <form th:action="@{/interactions/creer}" method="post" th:object="${interaction}" class="needs-validation" novalidate>
                    
                    <!-- Sélection du Client (si aucun client spécifié) -->
                    <div class="mb-3" th:if="!${client}">
                        <label for="clientId" class="form-label">Client / Prospect <span class="text-danger">*</span></label>
                        <select class="form-select" id="clientId" th:field="*{clientId}" required>
                            <option value="">-- Sélectionnez un client ou prospect --</option>
                            <option th:each="c : ${clients}" th:value="${c.id}" th:text="${c.nom}"></option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('clientId')}">
                            <span th:errors="*{clientId}"></span>
                        </div>
                    </div>

                    <!-- Client ID (caché si client spécifié) -->
                    <input type="hidden" th:if="${client}" th:field="*{clientId}" th:value="${client.id}">
                    
                    <!-- Type d'interaction -->
                    <div class="mb-3">
                        <label for="type" class="form-label">Type d'interaction <span class="text-danger">*</span></label>
                        <select class="form-select" id="type" th:field="*{type}" required>
                            <option value="">-- Sélectionnez un type --</option>
                            <option th:each="type : ${typesInteraction}" th:value="${type}" th:text="${type}"></option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('type')}">
                            <span th:errors="*{type}"></span>
                        </div>
                    </div>

                    <!-- Date et Heure -->
                    <div class="mb-3">
                        <label for="dateHeure" class="form-label">Date et Heure <span class="text-danger">*</span></label>
                        <input type="datetime-local" class="form-control" id="dateHeure" th:field="*{dateHeure}" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('dateHeure')}">
                            <span th:errors="*{dateHeure}"></span>
                        </div>
                    </div>

                    <!-- Résumé de l'interaction -->
                    <div class="mb-3">
                        <label for="resume" class="form-label">Résumé de l'interaction <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="resume" th:field="*{resume}" rows="5" 
                                  placeholder="Décrivez le contenu de l'interaction (appel, email, réunion, etc.)" required></textarea>
                        <small class="form-text text-muted">Maximum 1000 caractères</small>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('resume')}">
                            <span th:errors="*{resume}"></span>
                        </div>
                    </div>

                    <!-- Boutons -->
                    <div class="d-grid gap-2 d-md-flex justify-content-md-start mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Enregistrer l'interaction
                        </button>
                        <a th:href="@{/interactions/list}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Annuler
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Validation du formulaire Bootstrap
        (function () {
            'use strict';
            window.addEventListener('load', function () {
                var forms = document.querySelectorAll('.needs-validation');
                Array.prototype.slice.call(forms).forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        if (!form.checkValidity()) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                        form.classList.add('was-validated');
                    }, false);
                });
            });
        })();

        // Définir la date/heure actuelle par défaut
        document.addEventListener('DOMContentLoaded', function() {
            const dateInput = document.getElementById('dateHeure');
            if (!dateInput.value) {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                dateInput.value = `${year}-${month}-${day}T${hours}:${minutes}`;
            }
        });
    </script>
</body>

</html>
