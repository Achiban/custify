<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier Client - Custify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 60px 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 36px; max-width: 600px; width: 100%; }
        h1 { color: #f59e0b; font-size: 1.5rem; margin-bottom: 20px; }
        .form-label { color: #94a3b8; }
        .form-control { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; border-radius: 8px; }
        .form-control:focus { border-color: #f59e0b; background: #0f172a; color: #e2e8f0; box-shadow: 0 0 0 2px rgba(245,158,11,0.2); }
        .btn-submit { width: 100%; padding: 12px; background: linear-gradient(135deg,#f59e0b,#d97706); border: none; border-radius: 10px; color: #fff; font-weight: 600; }
        .btn-submit:hover { box-shadow: 0 6px 20px rgba(245,158,11,0.4); color: #fff; }
        a.back { color: #f59e0b; text-decoration: none; display: block; text-align: center; margin-top: 16px; }
        .alert-danger { background: rgba(239,68,68,0.15); border: 1px solid #ef4444; color: #fca5a5; border-radius: 8px; padding: 12px; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="card">
    <h1>Modifier le Client</h1>
    
    <div th:if="${error}" class="alert-danger" th:text="${error}"></div>
    
    <form method="post" th:action="@{'/commercial/clients/' + ${client.id} + '/modifier'}">
        <div class="row g-3">
            <div class="col-md-6 mb-3">
                <label class="form-label">Nom *</label>
                <input type="text" class="form-control" name="nom" th:value="${client.nom}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Prénom</label>
                <input type="text" class="form-control" name="prenom" th:value="${client.prenom}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Email *</label>
            <input type="email" class="form-control" name="email" th:value="${client.email}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Téléphone</label>
            <input type="text" class="form-control" name="telephone" th:value="${client.telephone}">
        </div>
        <div class="mb-3">
            <label class="form-label">Entreprise</label>
            <input type="text" class="form-control" name="entreprise" th:value="${client.entreprise}">
        </div>
        <div class="mb-3">
            <label class="form-label">Adresse</label>
            <input type="text" class="form-control" name="adresse" th:value="${client.adresse}">
        </div>
        
        <button type="submit" class="btn-submit">Enregistrer les modifications</button>
    </form>
    
    <a class="back" href="/commercial/dashboard">← Retour au dashboard</a>
</div>
</body>
</html>
