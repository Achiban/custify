<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planifier Réunion - Custify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 60px 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 36px; max-width: 600px; width: 100%; }
        h1 { color: #f59e0b; font-size: 1.5rem; margin-bottom: 8px; }
        .subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 24px; }
        .form-label { color: #94a3b8; }
        .form-control { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; border-radius: 8px; }
        .form-control:focus { border-color: #f59e0b; background: #0f172a; color: #e2e8f0; box-shadow: 0 0 0 2px rgba(245,158,11,0.2); }
        .btn-submit { width: 100%; padding: 12px; background: linear-gradient(135deg,#f59e0b,#d97706); border: none; border-radius: 10px; color: #fff; font-weight: 600; }
        .btn-submit:hover { box-shadow: 0 6px 20px rgba(245,158,11,0.4); color: #fff; }
        a.back { color: #f59e0b; text-decoration: none; display: block; text-align: center; margin-top: 16px; }
    </style>
</head>
<body>
<div class="card">
    <h1>Planifier une Réunion</h1>
    <div class="subtitle">
        Mettre en relation le vendeur <strong th:text="${affectation.opportunite.clientVendeur.nom}"></strong> et l'acheteur <strong th:text="${affectation.clientBeneficiaire.nom}"></strong> pour l'opportunité <strong th:text="${affectation.opportunite.titre}"></strong>.
    </div>
    
    <form method="post" th:action="@{'/commercial/affectations/' + ${affectation.id} + '/reunion'}">
        <div class="mb-3">
            <label class="form-label">Sujet de la réunion *</label>
            <input type="text" class="form-control" name="sujet" placeholder="ex: Négociation technique, Cadrage, etc." required>
        </div>
        <div class="mb-3">
            <label class="form-label">Date & Heure *</label>
            <input type="datetime-local" class="form-control" name="dateReunion" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Lieu / Lien de visioconférence *</label>
            <input type="text" class="form-control" name="lieu" placeholder="ex: Google Meet, Bureaux Custify, etc." required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description (optionnel)</label>
            <textarea class="form-control" name="description" rows="4" placeholder="Objectifs de la réunion, points à aborder..."></textarea>
        </div>
        
        <button type="submit" class="btn-submit">Planifier la réunion</button>
    </form>
    
    <a class="back" href="/commercial/dashboard">← Retour au dashboard</a>
</div>
</body>
</html>
