<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planifier Réunion - Custify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Flatpickr CSS (Dark Theme) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: 'Inter', 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 40px 20px; }
        .card { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 20px; 
            padding: 40px; 
            max-width: 600px; 
            width: 100%; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        h1 { color: #f59e0b; font-size: 1.8rem; font-weight: 700; margin-bottom: 12px; text-align: center; }
        .subtitle { color: #cbd5e1; font-size: 0.95rem; margin-bottom: 30px; text-align: center; line-height: 1.5; }
        .subtitle strong { color: #fff; }
        
        .form-label { color: #94a3b8; font-weight: 500; font-size: 0.9rem; margin-bottom: 8px; }
        .form-control { 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: #f8fafc; 
            border-radius: 12px; 
            padding: 12px 16px;
            transition: all 0.3s ease;
        }
        .form-control:focus { 
            border-color: #f59e0b; 
            background: rgba(15, 23, 42, 0.9); 
            color: #fff; 
            box-shadow: 0 0 0 4px rgba(245,158,11,0.15); 
        }
        .form-control::placeholder { color: #64748b; }
        
        .btn-submit { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #f59e0b, #ea580c); 
            border: none; 
            border-radius: 12px; 
            color: #fff; 
            font-weight: 600; 
            font-size: 1rem;
            margin-top: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-submit:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(234, 88, 12, 0.4); 
            color: #fff; 
        }
        a.back { color: #94a3b8; text-decoration: none; display: block; text-align: center; margin-top: 24px; transition: color 0.2s; }
        a.back:hover { color: #f59e0b; }
        
        /* Customizing flatpickr to fit the premium dark theme */
        .flatpickr-calendar.dark { box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
    </style>
</head>
<body>
<div class="card">
    <h1><i class="bi bi-calendar-event-fill"></i> Planifier une Réunion</h1>
    <div class="subtitle">
        Mettre en relation le vendeur <strong th:text="${affectation.opportunite.clientVendeur.nom}"></strong> et l'acheteur <strong th:text="${affectation.clientBeneficiaire.nom}"></strong> pour l'opportunité <strong th:text="${affectation.opportunite.titre}"></strong>.
    </div>
    
    <!-- Zone d'affichage des erreurs -->
    <div th:if="${error != null}" class="alert alert-danger" style="background: rgba(239,68,68,0.15); border: 1px solid #ef4444; color: #fca5a5; border-radius: 12px;">
        <span th:text="${error}"></span>
    </div>

    <form method="post" th:action="@{'/commercial/affectations/' + ${affectation.id} + '/reunion'}">
        <div class="mb-4">
            <label class="form-label">Sujet de la réunion *</label>
            <input type="text" class="form-control" name="sujet" placeholder="ex: Négociation technique, Cadrage, etc." required>
        </div>
        <div class="mb-4">
            <label class="form-label">Date & Heure *</label>
            <!-- L'input texte sera transformé en calendrier by Flatpickr -->
            <input type="text" class="form-control" id="dateReunionPicker" name="dateReunion" placeholder="Sélectionner une date et heure" required>
        </div>
        <div class="mb-4">
            <label class="form-label">Lieu / Lien de visioconférence *</label>
            <input type="text" class="form-control" name="lieu" placeholder="ex: Google Meet, Bureaux Custify, etc." required>
        </div>
        <div class="mb-4">
            <label class="form-label">Description (optionnel)</label>
            <textarea class="form-control" name="description" rows="3" placeholder="Objectifs de la réunion, points à aborder..."></textarea>
        </div>
        
        <button type="submit" class="btn-submit">Planifier la réunion</button>
    </form>
    
    <a class="back" href="/commercial/dashboard"><i class="bi bi-arrow-left"></i> Retour au tableau de bord</a>
</div>

<!-- Flatpickr JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<!-- Traduction Française pour Flatpickr -->
<script src="https://npmcdn.com/flatpickr/dist/l10n/fr.js"></script>

<script>
    // Initialisation du calendrier interactif
    flatpickr("#dateReunionPicker", {
        enableTime: true,        // Permet de choisir l'heure
        dateFormat: "Y-m-d\\TH:i", // Format requis par LocalDateTime en Java (ex: 2026-05-31T14:30)
        time_24hr: true,         // Format 24h
        minDate: "today",        // Empêche de sélectionner une date dans le passé
        locale: "fr"             // Calendrier en français
    });
</script>
</body>
</html>
