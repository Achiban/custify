<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User - Custify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Custify</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3" sec:authentication="name">User</span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <h1 class="mb-4">Create New User</h1>

                <div class="card">
                    <div class="card-body">
                        <form th:action="@{/users}" th:object="${utilisateur}" method="post">
                            <div class="mb-3">
                                <label for="nom" class="form-label">Name</label>
                                <input type="text" class="form-control" id="nom" th:field="*{nom}"
                                       th:errorclass="is-invalid" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nom')}"
                                     th:errors="*{nom}">Name error</div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" th:field="*{email}"
                                       th:errorclass="is-invalid" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                     th:errors="*{email}">Email error</div>
                            </div>

                            <div class="mb-3">
                                <label for="motDePasse" class="form-label">Password</label>
                                <input type="password" class="form-control" id="motDePasse" th:field="*{motDePasse}"
                                       th:errorclass="is-invalid" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('motDePasse')}"
                                     th:errors="*{motDePasse}">Password error</div>
                            </div>

                            <div class="mb-3">
                                <label for="role" class="form-label">Role</label>
                                <select class="form-select" id="role" th:field="*{role}"
                                        th:errorclass="is-invalid" required>
                                    <option value="">Select a role</option>
                                    <option th:value="ADMIN">ADMIN</option>
                                    <option th:value="COMMERCIAL">COMMERCIAL</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('role')}"
                                     th:errors="*{role}">Role error</div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Create User</button>
                                <a href="/users" class="btn btn-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
