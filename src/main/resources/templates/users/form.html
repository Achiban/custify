<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un utilisateur - Custify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        *, body { font-family: 'Inter', sans-serif; box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0f1e; color: #e2e8f0; }
        
        .sidebar { background: rgba(15,23,42,0.95); backdrop-filter: blur(20px); width: 260px; min-height: 100vh; position: fixed; top: 0; left: 0; padding: 32px 0; border-right: 1px solid rgba(255,255,255,0.06); z-index: 100; display: flex; flex-direction: column; }
        .sidebar-logo { padding: 0 28px 36px; border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 24px; }
        .sidebar-logo .brand { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, #f43f5e, #be123c); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .sidebar-logo .role { font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
        .sidebar-nav { flex: 1; padding: 0 16px; }
        .nav-label { font-size: 0.7rem; color: #475569; text-transform: uppercase; letter-spacing: 1.5px; padding: 0 12px; margin-bottom: 8px; margin-top: 16px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-radius: 12px; color: #94a3b8; text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: all 0.25s; margin-bottom: 4px; }
        .nav-item:hover { background: rgba(244, 63, 94, 0.1); color: #f43f5e; transform: translateX(4px); }
        .nav-item.active { background: linear-gradient(135deg, rgba(244, 63, 94, 0.2), rgba(190, 18, 60, 0.1)); color: #f43f5e; box-shadow: inset 3px 0 0 #f43f5e; }
        .nav-item .icon { font-size: 1.1rem; }
        .sidebar-footer { padding: 24px 16px 0; border-top: 1px solid rgba(255,255,255,0.06); margin-top: 16px; }
        .logout-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 16px; border-radius: 12px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.15); color: #f87171; font-weight: 600; cursor: pointer; transition: all 0.25s; text-align: left; }
        .logout-btn:hover { background: #ef4444; color: #fff; }
        
        .main { margin-left: 260px; padding: 50px; }
        .page-header { margin-bottom: 40px; }
        .page-header h1 { font-size: 2rem; font-weight: 800; color: #f8fafc; margin: 0; }
        
        .form-container { background: rgba(30,41,59,0.5); border: 1px solid rgba(255,255,255,0.07); border-radius: 20px; padding: 40px; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        
        .form-label { color: #94a3b8; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; }
        .form-control, .form-select { background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.1); color: #f8fafc; border-radius: 12px; padding: 12px 16px; transition: all 0.2s; }
        .form-control:focus, .form-select:focus { border-color: #f43f5e; box-shadow: 0 0 0 4px rgba(244,63,94,0.15); background: rgba(15,23,42,0.9); color: #fff; }
        
        .btn-primary-action { background: linear-gradient(135deg, #f43f5e, #be123c); border: none; padding: 13px 28px; border-radius: 12px; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.3s; }
        .btn-primary-action:hover { box-shadow: 0 8px 20px rgba(244,63,94,0.4); transform: translateY(-1px); color: #fff; }
        
        .btn-secondary-action { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); padding: 13px 28px; border-radius: 12px; color: #cbd5e1; font-weight: 600; font-size: 1rem; text-decoration: none; transition: all 0.3s; display: inline-block; }
        .btn-secondary-action:hover { background: rgba(255, 255, 255, 0.1); color: #fff; transform: translateY(-1px); }
        
        .error-message { color: #f87171; font-size: 0.85rem; margin-top: 6px; font-weight: 500; }
        .form-control.is-invalid { border-color: #ef4444; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-logo">
        <div class="brand">Custify</div>
        <div class="role">Espace Administrateur</div>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-label">Navigation</div>
        <a href="/admin/dashboard" class="nav-item"><i class="icon bi bi-grid-1x2-fill"></i> Tableau de bord</a>
        <a href="/admin/users" class="nav-item active"><i class="icon bi bi-people-fill"></i> Équipe Interne</a>
        <a href="/admin/clients" class="nav-item"><i class="icon bi bi-person-badge-fill"></i> Clients</a>
        <div class="nav-label">Autres</div>
        <a href="/" class="nav-item"><i class="icon bi bi-globe"></i> Catalogue public</a>
    </nav>
    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn"><i class="bi bi-box-arrow-left"></i> Déconnexion</button>
        </form>
    </div>
</div>

<div class="main">
    <div class="page-header">
        <h1><i class="bi bi-person-plus-fill text-danger me-2"></i> Créer un utilisateur interne</h1>
        <p>Ajoutez un nouveau collaborateur au sein de l'équipe administrative ou commerciale.</p>
    </div>
    
    <div class="form-container">
        <form th:action="@{/admin/users}" th:object="${utilisateur}" method="post">
            <div class="mb-4">
                <label for="nom" class="form-label">Nom complet *</label>
                <input type="text" id="nom" th:field="*{nom}" class="form-control" th:errorclass="is-invalid" placeholder="Ex: Jean Dupont" required>
                <div class="error-message" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}">Name error</div>
            </div>

            <div class="mb-4">
                <label for="email" class="form-label">Adresse email *</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid" placeholder="Ex: jean.dupont@custify.com" required>
                <div class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</div>
            </div>

            <div class="mb-4">
                <label for="motDePasse" class="form-label">Mot de passe *</label>
                <input type="password" id="motDePasse" th:field="*{motDePasse}" class="form-control" th:errorclass="is-invalid" placeholder="••••••••" required>
                <div class="error-message" th:if="${#fields.hasErrors('motDePasse')}" th:errors="*{motDePasse}">Password error</div>
            </div>

            <div class="mb-4">
                <label for="role" class="form-label">Rôle *</label>
                <select id="role" th:field="*{role}" class="form-select" th:errorclass="is-invalid" required>
                    <option value="">-- Sélectionner un rôle --</option>
                    <option th:value="ADMIN">ADMIN (Accès total)</option>
                    <option th:value="COMMERCIAL">COMMERCIAL (Opérationnel)</option>
                </select>
                <div class="error-message" th:if="${#fields.hasErrors('role')}" th:errors="*{role}">Role error</div>
            </div>

            <div class="d-flex gap-3 mt-5">
                <button type="submit" class="btn-primary-action"><i class="bi bi-check-circle-fill me-1"></i> Créer le membre</button>
                <a href="/admin/users" class="btn-secondary-action"><i class="bi bi-x-circle-fill me-1"></i> Annuler</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
