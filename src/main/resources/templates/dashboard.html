<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Custify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1e2a3a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .sidebar {
            background-color: #16212e;
            min-height: 100vh;
            padding: 20px 0;
            position: fixed;
            width: 200px;
        }
        .sidebar-brand {
            color: #4fc3f7;
            font-weight: bold;
            padding: 0 20px;
            margin-bottom: 30px;
            font-size: 1.2rem;
        }
        .sidebar-nav {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-nav li {
            padding: 12px 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .sidebar-nav li:hover {
            background-color: #1e2a3a;
        }
        .sidebar-nav li a {
            color: #b0bec5;
            text-decoration: none;
        }
        .logout-btn {
            background-color: #e74c3c;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            position: fixed;
            bottom: 20px;
            left: 20px;
            cursor: pointer;
        }
        .main-content {
            margin-left: 200px;
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #4fc3f7;
            font-size: 1.8rem;
            margin: 0;
        }
        .user-info {
            color: #b0bec5;
        }
        .user-info span {
            color: #4fc3f7;
        }
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .stat-card {
            background-color: #263645;
            border-radius: 8px;
            padding: 20px;
            border-left: 3px solid #4fc3f7;
        }
        .stat-card h3 {
            color: #4fc3f7;
            font-size: 0.9rem;
            margin-bottom: 10px;
            font-weight: normal;
        }
        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand">Custify Admin</div>
        <ul class="sidebar-nav">
            <li><a href="/dashboard">Dashboard</a></li>
            <li><a href="/users">Utilisateurs</a></li>
            <li><a href="/clients">Clients</a></li>
            <li><a href="/prospects">Prospects</a></li>
            <li><a href="/opportunites">Opportunités</a></li>
            <li><a href="/interactions">Interactions</a></li>
        </ul>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">Déconnexion</button>
        </form>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Tableau de bord</h1>
            <div class="user-info">
                Bienvenue Admin <span sec:authentication="name">👤</span>
            </div>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <h3>Clients</h3>
                <div class="stat-value" th:text="${stats.clientCount}">0</div>
            </div>
            <div class="stat-card">
                <h3>Prospects</h3>
                <div class="stat-value" th:text="${stats.prospectCount}">0</div>
            </div>
            <div class="stat-card">
                <h3>Opportunités</h3>
                <div class="stat-value" th:text="${stats.opportuniteCount}">0</div>
            </div>
            <div class="stat-card">
                <h3>Interactions</h3>
                <div class="stat-value" th:text="${stats.interactionCount}">0</div>
            </div>
        </div>
    </div>
</body>
</html>
