<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Custify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 40px 20px; }
        .card { background: #1e293b; border: 1px solid rgba(99,102,241,0.2); border-radius: 16px; padding: 36px; max-width: 540px; width: 100%; }
        h1 { color: #818cf8; font-size: 1.6rem; text-align: center; margin-bottom: 24px; }
        .form-label { color: #94a3b8; font-size: 0.9rem; }
        .form-control { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; border-radius: 8px; }
        .form-control:focus { border-color: #6366f1; background: #0f172a; color: #e2e8f0; box-shadow: 0 0 0 2px rgba(99,102,241,0.2); }
        .form-check-input { background-color: #0f172a; border-color: #334155; }
        .form-check-input:checked { background-color: #6366f1; border-color: #6366f1; }
        .form-check-label { color: #cbd5e1; }
        .btn-submit { width: 100%; padding: 12px; background: linear-gradient(135deg,#6366f1,#4f46e5); border: none; border-radius: 10px; color: #fff; font-weight: 600; }
        .btn-submit:hover { box-shadow: 0 8px 20px rgba(99,102,241,0.4); color: #fff; }
        .alert-error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; border-radius: 8px; padding: 10px; margin-bottom: 16px; }
        .link-login { text-align: center; margin-top: 16px; color: #94a3b8; }
        .link-login a { color: #818cf8; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <h1>Créer un compte</h1>
    <div th:if="${emailError}" class="alert-error" th:text="${emailError}"></div>
    <form method="post" th:action="@{/inscription}" th:object="${inscriptionRequest}">
        <div class="row g-3">
            <div class="col-6">
                <label class="form-label">Nom *</label>
                <input type="text" class="form-control" th:field="*{nom}" required>
                <small class="text-danger" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></small>
            </div>
            <div class="col-6">
                <label class="form-label">Prénom *</label>
                <input type="text" class="form-control" th:field="*{prenom}" required>
                <small class="text-danger" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></small>
            </div>
        </div>
        <div class="mt-3">
            <label class="form-label">Email *</label>
            <input type="email" class="form-control" th:field="*{email}" required>
            <small class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
        </div>
        <div class="mt-3">
            <label class="form-label">Mot de passe *</label>
            <input type="password" class="form-control" th:field="*{motDePasse}" required>
            <small class="text-danger" th:if="${#fields.hasErrors('motDePasse')}" th:errors="*{motDePasse}"></small>
        </div>
        <div class="mt-3">
            <label class="form-label">Téléphone *</label>
            <input type="text" class="form-control" th:field="*{telephone}" required>
        </div>
        <div class="row g-3 mt-0">
            <div class="col-6">
                <label class="form-label">Entreprise</label>
                <input type="text" class="form-control" th:field="*{entreprise}">
            </div>
            <div class="col-6">
                <label class="form-label">SIRET (optionnel)</label>
                <input type="text" class="form-control" th:field="*{siret}">
            </div>
        </div>
        <div class="mt-3">
            <label class="form-label">Adresse</label>
            <input type="text" class="form-control" th:field="*{adresse}">
        </div>
        <div class="mt-3">
            <label class="form-label">Secteurs d'intérêt</label>
            <div class="row">
                <div class="col-6" th:each="secteur : ${secteurs}">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" th:value="${secteur.id}" name="secteurIds" th:id="'s'+${secteur.id}">
                        <label class="form-check-label" th:for="'s'+${secteur.id}" th:text="${secteur.nom}"></label>
                    </div>
                </div>
            </div>
        </div>
        <button type="submit" class="btn-submit mt-4">Créer mon compte</button>
    </form>
    <div class="link-login">Déjà un compte ? <a th:href="@{/login}">Se connecter</a></div>
</div>
</body>
</html>
