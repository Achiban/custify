<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Créer Client - Custify</title>

    <style>
        body {
            background-color: #1e2a3a;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
        }

        .sidebar {
            background-color: #16212e;
            min-height: 100vh;
            width: 200px;
            position: fixed;
            padding: 20px;
        }

        .sidebar a {
            display: block;
            color: #b0bec5;
            text-decoration: none;
            padding: 10px 0;
        }

        .sidebar a:hover {
            color: #4fc3f7;
        }

        .main-content {
            margin-left: 220px;
            padding: 30px;
        }

        .form-container {
            background-color: #263645;
            padding: 30px;
            border-radius: 8px;
            width: 500px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            color: #b0bec5;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            background-color: #1e2a3a;
            border: 1px solid #3a4a5c;
            color: white;
            border-radius: 5px;
        }

        input:focus {
            border-color: #4fc3f7;
            outline: none;
        }

        .btn {
            background-color: #4fc3f7;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        .btn:hover {
            background-color: #3ab0e0;
        }

        .error {
            color: #e74c3c;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h3>Custify</h3>
    <a href="/dashboard">Dashboard</a>
    <a href="/clients/list">Clients</a>
</div>

<div class="main-content">
    <h2>Créer Client</h2>

    <div class="form-container">

        <form th:action="@{/clients/save}" th:object="${client}" method="post">

            <div class="form-group">
                <label>Nom</label>
                <input type="text" th:field="*{nom}" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}" required>
            </div>

            <div class="form-group">
                <label>Téléphone</label>
                <input type="text" th:field="*{telephone}" required>
            </div>

            <div class="form-group">
                <label>Entreprise</label>
                <input type="text" th:field="*{entreprise}" required>
            </div>

            <button type="submit" class="btn">Créer</button>

        </form>

    </div>
</div>

</body>
</html>
