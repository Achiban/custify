<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Créer Client - Custify</title>

    <style>
        body {
            background-color: #1e2a3a;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
        }

        .sidebar {
            background-color: #16212e;
            min-height: 100vh;
            padding: 20px 0;
            position: fixed;
            width: 200px;
        }
        .sidebar-brand {
            color: #4fc3f7;
            font-weight: bold;
            padding: 0 20px;
            margin-bottom: 30px;
            font-size: 1.2rem;
        }
        .sidebar-nav {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-nav li {
            padding: 12px 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .sidebar-nav li:hover {
            background-color: #1e2a3a;
        }
        .sidebar-nav li a {
            color: #b0bec5;
            text-decoration: none;
        }
        .logout-btn {
            background-color: #e74c3c;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            position: fixed;
            bottom: 20px;
            left: 20px;
            cursor: pointer;
        }

        .sidebar a {
            display: block;
            color: #b0bec5;
            text-decoration: none;
            padding: 10px 0;
        }

        .sidebar a:hover {
            color: #4fc3f7;
        }

        .main-content {
            margin-left: 220px;
            padding: 30px;
        }

        .form-container {
            background-color: #263645;
            padding: 30px;
            border-radius: 8px;
            width: 500px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            color: #b0bec5;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            background-color: #1e2a3a;
            border: 1px solid #3a4a5c;
            color: white;
            border-radius: 5px;
        }

        input:focus {
            border-color: #4fc3f7;
            outline: none;
        }

        .btn {
            background-color: #4fc3f7;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        .btn:hover {
            background-color: #3ab0e0;
        }

        .error {
            color: #e74c3c;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div class="sidebar-brand">Custify  
            <span sec:authorize="hasRole('ADMIN')">ADMIN</span>
            <span sec:authorize="hasRole('COMMERCIAL')">COMMERCIAL</span>
        </div>
        <ul class="sidebar-nav">
            <li><a href="/dashboard">Dashboard</a></li>

            <li sec:authorize="hasRole('ADMIN')">
                <a href="/users">Utilisateurs</a>
            </li>

            <li sec:authorize="hasAnyRole('ADMIN','COMMERCIAL')">
                <a href="/clients">Clients</a>
            </li>

            <li sec:authorize="hasAnyRole('ADMIN','COMMERCIAL')">
                <a href="/prospects">Prospects</a>
            </li>

            <li sec:authorize="hasAnyRole('ADMIN','COMMERCIAL')">
                <a href="/opportunites">Opportunités</a>
            </li>

            <li sec:authorize="hasAnyRole('ADMIN','COMMERCIAL')">
                <a href="/interactions">Interactions</a>
            </li>
        </ul>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">Déconnexion</button>
        </form>
    </div>

<div class="main-content">
    <h2>Créer Client</h2>

    <div class="form-container">

        <form th:action="@{/clients/save}" th:object="${client}" method="post">

            <div class="form-group">
                <label>Nom</label>
                <input type="text" th:field="*{nom}" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}" required>
            </div>

            <div class="form-group">
                <label>Téléphone</label>
                <input type="text" th:field="*{telephone}" required>
            </div>

            <div class="form-group">
                <label>Entreprise</label>
                <input type="text" th:field="*{entreprise}" required>
            </div>

            <button type="submit" class="btn">Créer</button>

        </form>

    </div>
</div>

</body>
</html>
