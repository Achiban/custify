# ── Base de données H2 in-memory (MySQL compatibility mode) ──────────────────
spring.datasource.url=jdbc:h2:mem:custify_test;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ── JPA : Hibernate crée le schéma (Liquibase désactivé car SQL MySQL-spécifique) ──
spring.liquibase.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Désactiver DevTools en tests ──────────────────────────────────────────────
spring.devtools.add-properties=false

# ── Réduire le bruit de logs en tests ─────────────────────────────────────────
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.liquibase=WARN
logging.level.com.custify=INFO
